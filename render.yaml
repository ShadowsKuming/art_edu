# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: artbloom-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: artbloom-db
          property: connectionString
      - key: JWT_SECRET
        sync: false         # paste a random secret in Render dashboard
      - key: INVITE_CODE_1
        sync: false         # e.g. BLOOM-2026-A  — add INVITE_CODE_4, _5, … to expand
      - key: INVITE_CODE_2
        sync: false
      - key: INVITE_CODE_3
        sync: false
      - key: TEXTBOOK_ASSETS_URL
        sync: false
      - key: ARK_API_KEY
        sync: false
      - key: ARK_STORY_MODEL
        sync: false
      - key: ARK_CHAT_MODEL
        sync: false
      - key: ARK_VIDEO_MODEL
        sync: false
      - key: ARK_IMAGE_MODEL
        sync: false
      # §35 — Durable storage for AI-generated media (single PUBLIC R2 bucket
      # receives BOTH Part-6 images and Part-3 videos; key prefixes keep them
      # apart: generated/part6/*.png and generated/anim/*.mp4). Set all five in
      # the Render dashboard. When unset, main.py silently falls back to the
      # ephemeral Ark URLs (behaviour identical to pre-§35).
      - key: R2_ENDPOINT_URL
        sync: false         # https://<account-id>.r2.cloudflarestorage.com
      - key: R2_ACCESS_KEY_ID
        sync: false         # R2 API token (must be scoped to the bucket below)
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_GENERATED_BUCKET
        sync: false         # e.g. artbloom-generated-video  (must be PUBLIC)
      - key: R2_GENERATED_PUBLIC_URL
        sync: false         # e.g. https://pub-xxxx.r2.dev  (no trailing slash)

databases:
  - name: artbloom-db
    databaseName: artbloom
    user: artbloom
    plan: free
    region: oregon
